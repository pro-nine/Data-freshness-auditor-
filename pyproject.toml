[project]
name = "data-freshness-auditor"
version = "0.2.0"
description = "Data freshness auditing with feature engineering, EDA and gradient-boosted models"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "networkx",
    "statsmodels",
    "scipy",
    "lightgbm",
    "scikit-learn",
    "matplotlib",
    "shap",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
